[project]
name = "salonnare-mcp"
version = "1.1.0"
description = "Connect Salonnare to ChatGPT, Claude and any AI agent through Cotlet.dev, a hosted MCP server. No Salonnare API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["salonnare", "salonnare api", "salonnare mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/salonnare-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=salonnare"
Source = "https://github.com/cotlet-connect/salonnare-mcp"

[project.scripts]
salonnare-mcp = "salonnare_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"salonnare_agent.py" = "salonnare_agent.py"

[tool.hatch.build.targets.sdist]
include = ["salonnare_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
